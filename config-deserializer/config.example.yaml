pages:
  - prefix: "fol."
    suffix: "r"
  - prefix: "fol."
    suffix: "v"

blocks:
  - start_marker: "[illustration]"
    type: "STANDALONE"
  - start_marker: "[legend]"
    has_text: true
    type: "WITH_TEXT"
    end_marker: "---"
  - start_marker: "[margin]"
    has_text: true
    type: "WITH_TEXT"
    end_marker: "---"

words:
  - label: "Arabic"
    char_range: [600, 0x60FF]
    additional_chars: []
    default_state: "sound"

prefixes:
  - symbol: "*"
    label: "emendation"
  - symbol: "?"
    label: "unintelligible"
  - symbol: "؟"
    label: "unintelligible"
  - symbol: "!"
    label: "error"
  - symbol: "†"
    label: "corrupt"

brackets:
  - open: "("
    close: ")"
    label: "title"
  - open: "["
    close: "]"
    label: "superfluous"
    skip: true
  - precedence: 0
    open: "[["
    close: "]]"
    label: "cross-out"
    skip: true
  - open: "{"
    close: "}"
    label: "suppletion"
  - open: "<"
    close: ">"
    label: "added"

tags:
  - symbol: "***"
    label: "lacuna"
  - symbol: "..."
    label: "damage"
