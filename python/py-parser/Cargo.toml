[package]
name = "py-parser"
version = "0.1.4"
edition = "2021"
license = "GPL-3.0-or-later"
license-file = "../../LICENSE"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "py_parser"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.23.4"
parser = { path = "../../parser" }
config-deserializer = { path = "../../config-deserializer" }
regex-syntax = "0.8.4"


